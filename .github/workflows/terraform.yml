name: Terraform Prod
on:
  push:
    branches:
      - main
      - features/sujeet
      - features/ajeet
      - 'features/**'

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID || '7d69a824-b946-44ae-9f4a-bfcb23511085' }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID || 'ced5781c-1212-48f2-8dde-57e09383d9ee' }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID || '159a3e1a-9b1c-4856-b0f1-79835fcb99f0' }}
  ARM_USE_OIDC: "true"

jobs:

  terraform-plan:

    name: Terraform Scan and Plan

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./environment/prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login - OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Verify Azure Login
        run: |
          az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan


  terraform-apply:

    name: Terraform Apply

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    needs: terraform-plan
    
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./environment/prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login - OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
